services:
  game:
    build:
      context: .
      args:
        BUILD_MODE: ${BUILD_MODE:-kiosk}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_KIOSK_SECRET: ${VITE_KIOSK_SECRET:-}
    image: mosaic:${BUILD_MODE:-kiosk}
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped

  # Optional dev server with hot reload: docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    image: node:22-slim
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
      VITE_KIOSK_SECRET: ${VITE_KIOSK_SECRET:-}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  node_modules:
